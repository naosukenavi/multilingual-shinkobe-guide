name: Update Guide translations

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Guide translations only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
          "zh:{title:'新神户站指南',subtitle:'给外国游客的新神户站巴士指南',notice:'请把照片与车站现场的指示牌对照确认。',rotary:'環形廣場巴士站',tunnel:'隧道入口巴士站',hotel:'飯店入口'}": "zh:{title:'新神户站指南',subtitle:'给外国游客的新神户站巴士指南',notice:'请把照片与车站现场的指示牌对照确认。',guideBtn:'指南 / 使用方法',walkingBtn:'Walking Routes',busBtn:'Bus Stops',guideTitle:'📖 指南 / 使用方法',guide1h:'关于本指南',guide1:'新神户站有多个巴士站。本指南帮助您根据目的地找到正确的巴士站。',guide2h:'如何使用照片',guide2:'步行时，请将车站的指示牌与照片进行对照。路线会在环形广场、隧道入口和酒店入口处分开。',guide3h:'重要提示',guide3:'请在当天确认官方信息，包括时刻表、停运或服务变更以及巴士站变更。照片仅作为辅助导航。',guide4h:'如果迷路了',guide4:'如果找不到路，请先停在安全的地方，然后查看车站指示牌或向车站工作人员求助。',rotary:'環形廣場巴士站',tunnel:'隧道入口巴士站',hotel:'飯店入口'}",
          "ko:{title:'신코베역 안내',subtitle:'외국인 여행객을 위한 신코베역 버스 안내',notice:'사진과 역의 안내 표지판을 함께 확인해 주세요。',rotary:'로터리',tunnel:'터널 입구 버스 정류장',hotel:'호텔 입구'}": "ko:{title:'신코베역 안내',subtitle:'외국인 여행객을 위한 신코베역 버스 안내',notice:'사진과 역의 안내 표지판을 함께 확인해 주세요。',guideBtn:'안내 / 이용 방법',walkingBtn:'Walking Routes',busBtn:'Bus Stops',guideTitle:'📖 안내 / 이용 방법',guide1h:'이 안내에 대하여',guide1:'신코베역에는 여러 버스 정류장이 있습니다. 이 안내는 목적지에 맞는 정류장을 찾는 데 도움을 드립니다.',guide2h:'사진 이용 방법',guide2:'걸으면서 역의 안내 표지판과 사진을 비교해 주세요. 로터리, 터널 입구, 호텔 입구에서 경로가 나뉩니다.',guide3h:'주의사항',guide3:'시간표, 운행 변경, 정류장 변경 등은 당일 공식 안내를 확인해 주세요. 사진은 길찾기를 돕기 위한 자료입니다.',guide4h:'길을 잃었을 때',guide4:'길을 모르겠다면 먼저 안전한 곳에 멈춘 후 역의 안내 표지판을 확인하거나 역 직원에게 도움을 요청하세요.',rotary:'로터리',tunnel:'터널 입구 버스 정류장',hotel:'호텔 입구'}",
          "th:{title:'คู่มือสถานีชินโกเบ',subtitle:'คู่มือรถบัสสำหรับนักท่องเที่ยวต่างชาติ',notice:'โปรดเปรียบเทียบภาพกับป้ายจริงภายในสถานี',rotary:'ป้ายรถบริเวณวงเวียน',tunnel:'ป้ายรถทางเข้าทางอุโมงค์',hotel:'หน้าโรงแรม'}": "th:{title:'คู่มือสถานีชินโกเบ',subtitle:'คู่มือรถบัสสำหรับนักท่องเที่ยวต่างชาติ',notice:'โปรดเปรียบเทียบภาพกับป้ายจริงภายในสถานี',guideBtn:'คู่มือ / วิธีใช้',walkingBtn:'Walking Routes',busBtn:'Bus Stops',guideTitle:'📖 คู่มือ / วิธีใช้',guide1h:'เกี่ยวกับคู่มือนี้',guide1:'สถานีชินโกเบมีป้ายรถหลายแห่ง คู่มือนี้ช่วยให้คุณค้นหาป้ายรถที่ถูกต้องจากจุดหมายปลายทางของคุณ',guide2h:'วิธีใช้ภาพ',guide2:'ขณะเดิน โปรดเปรียบเทียบภาพกับป้ายบอกทางที่สถานี เส้นทางจะแยกกันที่วงเวียน ทางเข้าทางอุโมงค์ และทางเข้าโรงแรม',guide3h:'ข้อสำคัญ',guide3:'โปรดตรวจสอบข้อมูลอย่างเป็นทางการในวันเดินทาง เช่น ตารางเวลา การเปลี่ยนแปลงการให้บริการ หรือการเปลี่ยนป้ายรถ ภาพเป็นเพียงตัวช่วยในการนำทาง',guide4h:'หากหลงทาง',guide4:'หากไม่แน่ใจว่าไปทางไหน ให้หยุดในจุดที่ปลอดภัยก่อน แล้วดูป้ายในสถานีหรือขอความช่วยเหลือจากเจ้าหน้าที่',rotary:'ป้ายรถบริเวณวงเวียน',tunnel:'ป้ายรถทางเข้าทางอุโมงค์',hotel:'หน้าโรงแรม'}",
          "ru:{title:'Путеводитель по станции Син-Кобэ',subtitle:'Автобусный гид для иностранных посетителей',notice:'Сравнивайте фотографии с указателями на станции.',rotary:'Автобусная остановка на кольцевой площади',tunnel:'Остановка у входа в туннель',hotel:'Остановка у входа в отель'}": "ru:{title:'Путеводитель по станции Син-Кобэ',subtitle:'Автобусный гид для иностранных посетителей',notice:'Сравнивайте фотографии с указателями на станции.',guideBtn:'Гид / Как пользоваться',walkingBtn:'Walking Routes',busBtn:'Bus Stops',guideTitle:'📖 Гид / Как пользоваться',guide1h:'О гиде',guide1:'На станции Син-Кобэ несколько автобусных остановок. Этот гид поможет вам найти нужную остановку по месту назначения.',guide2h:'Как пользоваться фотографиями',guide2:'Сравнивайте фотографии с указателями на станции во время движения. Маршруты расходятся у кольцевой площади, входа в туннель и входа в отель.',guide3h:'Важно',guide3:'В день поездки проверяйте официальную информацию о расписании, изменениях движения и остановок. Фотографии служат только для помощи в навигации.',guide4h:'Если вы заблудились',guide4:'Если вы не знаете, куда идти, остановитесь в безопасном месте, проверьте указатели на станции или обратитесь к сотруднику станции.',rotary:'Автобусная остановка на кольцевой площади',tunnel:'Остановка у входа в туннель',hotel:'Остановка у входа в отель'}",
          "es:{title:'Guía de la estación Shin-Kobe',subtitle:'Guía de autobuses para visitantes extranjeros',notice:'Compare las fotos con las señales de la estación.',rotary:'Parada en la rotonda',tunnel:'Parada en la entrada del túnel',hotel:'Parada frente al hotel'}": "es:{title:'Guía de la estación Shin-Kobe',subtitle:'Guía de autobuses para visitantes extranjeros',notice:'Compare las fotos con las señales de la estación.',guideBtn:'Guía / Cómo usarla',walkingBtn:'Walking Routes',busBtn:'Bus Stops',guideTitle:'📖 Guía / Cómo usarla',guide1h:'Sobre esta guía',guide1:'La estación Shin-Kobe tiene varias paradas de autobús. Esta guía le ayuda a encontrar la parada correcta según su destino.',guide2h:'Cómo usar las fotos',guide2:'Mientras camina, compare las fotos con las señales de la estación. Las rutas se separan en la rotonda, la entrada del túnel y la entrada del hotel.',guide3h:'Importante',guide3:'El día del viaje, consulte la información oficial sobre horarios, cambios de servicio o cambios de parada. Las fotos son solo una ayuda para orientarse.',guide4h:'Si se pierde',guide4:'Si no sabe por dónde ir, deténgase primero en un lugar seguro y consulte las señales de la estación o pida ayuda al personal.',rotary:'Parada en la rotonda',tunnel:'Parada en la entrada del túnel',hotel:'Parada frente al hotel'}"
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit('Expected text block not found; no changes made.')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Translate Guide / How to use'
          git push